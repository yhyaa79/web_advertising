<div class="listing-card-tools">
    <button class="share-listing-btn" type="button" aria-label="اشتراک‌گذاری" title="اشتراک‌گذاری"
        data-title="{{ listing.title }}" data-url="{{ request.scheme }}://{{ request.get_host }}{% url 'listings:listing_detail' listing.pk %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="m8.59 13.51 6.83 3.98m-.01-10.98-6.82 3.98"/>
        </svg>
    </button>
    {% if user.is_authenticated %}
    <button class="save-listing-btn" type="button" aria-label="ذخیره آگهی" title="ذخیره آگهی"
        data-listing-id="{{ listing.pk }}" data-is-saved="{% if listing.pk in saved_listing_ids %}true{% else %}false{% endif %}">
        <svg class="bookmark-icon {% if listing.pk in saved_listing_ids %}saved{% endif %}"
            width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
    </button>
    {% endif %}
</div>
